version: "3.8"

services:
    sedie-multiplayer:
        image: sedie-multiplayer-game:latest
        container_name: sedie-game-container
        ports:
            - "5000:5000"
        environment:
            - NODE_ENV=production
        restart: unless-stopped
        networks:
            - game-network

    reverse-proxy:
        image: sedie-multiplayer-game:latest
        container_name: sedie-proxy-container
        working_dir: /app/packages/sedie-multiplayer
        ports:
            - "3000:3000"
        volumes:
            - .:/app/packages/sedie-multiplayer
        command: node reverse-proxy.js
        environment:
            - PROXY_PORT=3000
            - TARGET_HOST=http://sedie-multiplayer:5000
        depends_on:
            - sedie-multiplayer
        restart: unless-stopped
        networks:
            - game-network

networks:
    game-network:
        driver: bridge
