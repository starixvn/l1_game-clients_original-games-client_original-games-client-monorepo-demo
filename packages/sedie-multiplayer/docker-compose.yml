version: "3.8"

services:
    sedie-multiplayer:
        build:
            context: ..
            dockerfile: packages/sedie-multiplayer/Dockerfile
        container_name: sedie-game-container
        ports:
            - "5000:5000"
        environment:
            - NODE_ENV=production
        restart: unless-stopped
        networks:
            - game-network

    reverse-proxy:
        image: node:18-alpine
        container_name: sedie-proxy-container
        working_dir: /app
        ports:
            - "3000:3000"
        volumes:
            - .:/app
            - /app/node_modules
        command: npm run proxy
        environment:
            - PROXY_PORT=3000
            - TARGET_HOST=http://sedie-multiplayer:5000
        depends_on:
            - sedie-multiplayer
        restart: unless-stopped
        networks:
            - game-network

networks:
    game-network:
        driver: bridge
